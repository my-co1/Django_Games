<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>مطابقة البطاقات</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; }
        .grid { display: grid; grid-template-columns: repeat(4, 75px); gap: 10px; margin: 20px auto; width: 330px; }
        .card { width: 75px; height: 75px; font-size: 30px; border-radius: 8px; border: 2px solid #28a745; background: #28a745; color: white; cursor: pointer; }
        .open { background: #fff; color: #000; }
    </style>
</head>
<body>
    <h2>لعبة مطابقة بطاقات الذاكرة 🃏</h2>
    {% if won %}<h3 style="color: green;">🎉 فزت بالمطابقة وتجاوزت التحدي!</h3>{% endif %}
    <form method="POST">{% csrf_token %}
        <div class="grid">
            {% for card in cards %}
                {% if forloop.counter0 in matched or forloop.counter0 in flipped %}
                    <button class="card open" type="button">{{ card }}</button>
                {% else %}
                    <button class="card" type="submit" name="card_idx" value="{{ forloop.counter0 }}">❓</button>
                {% endif %}
            {% endfor %}
        </div>
    </form>
    <a href="{% url 'memory' %}?reset=1">إعادة توزيع البطاقات</a> | <a href="{% url 'home' %}">الرئيسية</a>
</body>
</html>
