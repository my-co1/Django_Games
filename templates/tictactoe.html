<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><title>إكس أو</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; }
        .grid { display: grid; grid-template-columns: repeat(3, 85px); gap: 5px; margin: 20px auto; width: 265px; }
        .cell { width: 85px; height: 85px; font-size: 32px; font-weight: bold; cursor: pointer; background: #fff; border: 2px solid #007bff; }
    </style>
</head>
<body>
    <h2>لعبة X - O ضد السيرفر ❌⭕</h2>
    <h3>{{ status }}</h3>
    <form method="POST">{% csrf_token %}
        <div class="grid">
            {% for val in board %}
                <button class="cell" type="submit" name="cell" value="{{ forloop.counter0 }}" {% if val or game_over %}disabled{% endif %}>
                    {{ val }}
                </button>
            {% endfor %}
        </div>
    </form>
    <a href="{% url 'tictactoe' %}?reset=1">لعبة جديدة</a> | <a href="{% url 'home' %}">الرئيسية</a>
</body>
</html>
